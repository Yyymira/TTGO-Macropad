; TTGO T-Display (ESP32 + ST7789 1.14" 240x135) macropad firmware
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
; Particiones con OTA y 1.9 MB por app: WiFi + Bluetooth no entran en la
; tabla por defecto (1.2 MB). Cambiar la tabla requiere un flasheo por USB.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    thomasfredericks/Bounce2 @ ^2.71
    madhephaestus/ESP32Encoder @ ^0.11.7
    bblanchon/ArduinoJson @ ^7.0.4
    t-vk/ESP32 BLE Keyboard @ ^0.3.2
    h2zero/NimBLE-Arduino @ ^1.4.3

; Configura TFT_eSPI para el panel ST7789 del T-Display sin tocar archivos
; de la librería (equivalente a Setup25_TTGO_T_Display.h de Bodmer).
build_flags =
    ; Antirrebote instantáneo: la tecla sale en el primer contacto, y los rebotes
    ; se ignoran (Bounce2 "prompt detection").
    -DBOUNCE_WITH_PROMPT_DETECTION
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    ; ESP32 BLE Keyboard sobre NimBLE (más liviano que Bluedroid; deja RAM para el WiFi)
    -DUSE_NIMBLE

; Actualización por WiFi: usar ./ota_upload.sh, que toma la contraseña de
; ~/.config/ttgo-macropad/config.json y la IP del servicio de la PC.
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_flags = --auth=${sysenv.TTGO_OTA_PASS}
