<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 260px; margin: 12px; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #eee; background: #2a2a2e; } }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #status { margin: 0 0 10px; }
  #status.ok { color: #2e9e4f; }
  #help { font-size: 12px; opacity: .75; margin: 8px 0 0; }
  button { font: inherit; padding: 6px 12px; cursor: pointer; }
  h2 { font-size: 13px; margin: 14px 0 6px; }
  #pick { width: 100%; margin-top: 10px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; }
  li span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li small { opacity: .6; }
  li button { padding: 2px 8px; font-size: 12px; }
  #empty { font-size: 12px; opacity: .6; margin: 0; }
</style>
</head>
<body>
  <h1>TTGO Macropad</h1>
  <p id="status">…</p>
  <button id="pair"></button>
  <button id="unpair" hidden></button>
  <p id="help"></p>
  <button id="pick"></button>
  <h2 id="targetsTitle"></h2>
  <ul id="targets"></ul>
  <p id="empty"></p>
  <script src="popup.js"></script>
</body>
</html>
